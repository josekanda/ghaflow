<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="g" x1="6" y1="14" x2="58" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="f" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cl">
      <rect x="0" y="0" width="32" height="64"/>
    </clipPath>
    <clipPath id="cr">
      <rect x="32" y="0" width="32" height="64"/>
    </clipPath>
  </defs>
  <!-- Pass 1: Link 1 right half behind Link 2 -->
  <g clip-path="url(#cr)">
    <g transform="translate(22,32) rotate(-10)">
      <rect x="-10" y="-14" width="20" height="28" rx="7" fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Pass 2: Link 2 full in front -->
  <g transform="translate(42,32) rotate(-10)" filter="url(#f)">
    <rect x="-10" y="-14" width="20" height="28" rx="7" fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linejoin="round"/>
  </g>
  <!-- Pass 3: Link 1 left half in front of Link 2 -->
  <g clip-path="url(#cl)">
    <g transform="translate(22,32) rotate(-10)" filter="url(#f)">
      <rect x="-10" y="-14" width="20" height="28" rx="7" fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
